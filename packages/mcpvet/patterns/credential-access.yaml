# Credential access patterns — anything that suggests reading secrets.
# References:
#   - https://owasp.org/www-project-mcp-top-10/ (MCP03: Tool Poisoning)
#   - https://cwe.mitre.org/data/definitions/522.html (Insufficiently Protected Credentials)
version: 1
patterns:
  - id: cred-ssh-private-key
    name: SSH private key access
    description: |
      Tool description references SSH private keys. The single highest-value
      target for any post-exploitation payload.
    category: credential-access
    severity: critical
    fields: [description, command, args, env]
    matchers:
      - kind: regex
        pattern: "~?/\\.ssh/(id_rsa|id_ed25519|id_ecdsa|.*_rsa|.*_key)"
        flags: "i"
      - kind: keyword
        pattern: ".ssh/id_"
        caseSensitive: false
    references:
      - https://cwe.mitre.org/data/definitions/522.html

  - id: cred-aws-credentials
    name: AWS credentials access
    description: |
      Tool description references AWS credentials, config, or session tokens.
    category: credential-access
    severity: critical
    fields: [description, command, args, env]
    matchers:
      - kind: regex
        pattern: "~?/\\.aws/(credentials|config|sso/cache)"
        flags: "i"
      - kind: keyword
        pattern: "AWS_SECRET_ACCESS_KEY"
        caseSensitive: true
    references:
      - https://cwe.mitre.org/data/definitions/522.html

  - id: cred-gcp-credentials
    name: GCP credentials access
    description: |
      Tool description references GCP service account keys or application
      default credentials.
    category: credential-access
    severity: critical
    fields: [description, command, args, env]
    matchers:
      - kind: regex
        pattern: "~?/\\.config/gcloud/.*\\.json"
        flags: "i"
      - kind: keyword
        pattern: "GOOGLE_APPLICATION_CREDENTIALS"
        caseSensitive: true
    references:
      - https://cwe.mitre.org/data/definitions/522.html

  - id: cred-azure-credentials
    name: Azure credentials access
    description: |
      Tool description references Azure auth tokens, device code, or CLI
      credentials cache.
    category: credential-access
    severity: critical
    fields: [description, command, args, env]
    matchers:
      - kind: keyword
        pattern: "AZURE_TENANT_ID"
        caseSensitive: true
      - kind: regex
        pattern: "~?/\\.azure/"
        flags: "i"
    references:
      - https://cwe.mitre.org/data/definitions/522.html

  - id: cred-github-token-env
    name: GitHub token in environment
    description: |
      Tool description references the GITHUB_TOKEN environment variable or
      a personal access token.
    category: credential-access
    severity: high
    fields: [description, env]
    matchers:
      - kind: keyword
        pattern: "GITHUB_TOKEN"
        caseSensitive: true
      - kind: regex
        pattern: "ghp_[A-Za-z0-9]{36}"
    references:
      - https://cwe.mitre.org/data/definitions/522.html

  - id: cred-npm-token
    name: NPM auth token access
    description: |
      Tool description references the .npmrc file or NPM_TOKEN environment
      variable, which usually contains publish credentials.
    category: credential-access
    severity: high
    fields: [description, command, args, env]
    matchers:
      - kind: regex
        pattern: "~?/\\.npmrc"
        flags: "i"
      - kind: keyword
        pattern: "NPM_TOKEN"
        caseSensitive: true
    references:
      - https://cwe.mitre.org/data/definitions/522.html

  - id: cred-env-dump
    name: Bulk environment variable dump
    description: |
      Tool description suggests dumping the entire process environment
      (which contains all secrets in plain text).
    category: credential-access
    severity: high
    fields: [description, command, args]
    matchers:
      - kind: keyword
        pattern: "process.env"
        caseSensitive: true
      - kind: keyword
        pattern: "os.environ"
        caseSensitive: true
      - kind: regex
        pattern: "(printenv|^env$|set\\s*\\|\\s*grep)"
    references:
      - https://cwe.mitre.org/data/definitions/526.html

  - id: cred-shell-history
    name: Shell history access
    description: |
      Tool description references shell history files, which often contain
      typed credentials, tokens, and connection strings.
    category: credential-access
    severity: medium
    fields: [description, command, args]
    matchers:
      - kind: regex
        pattern: "~?/\\.(bash|zsh|fish)_history"
        flags: "i"
    references:
      - https://cwe.mitre.org/data/definitions/200.html

  - id: cred-private-key-file
    name: Private key file (PEM)
    description: |
      Tool description references .pem or .key files, which contain
      TLS, SSH, or signing private keys.
    category: credential-access
    severity: high
    fields: [description, command, args]
    matchers:
      - kind: regex
        pattern: "\\.(pem|key|pfx|p12)$"
        flags: "i"
    references:
      - https://cwe.mitre.org/data/definitions/522.html

  - id: cred-browser-cookies
    name: Browser cookie store access
    description: |
      Tool description references browser cookie databases, which contain
      session tokens for every site the user is logged into.
    category: credential-access
    severity: high
    fields: [description, command, args]
    matchers:
      - kind: regex
        pattern: "(Cookies|cookies\\.sqlite|Login Data)"
      - kind: keyword
        pattern: "Library/Application Support/Google/Chrome"
        caseSensitive: false
    references:
      - https://cwe.mitre.org/data/definitions/1004.html
